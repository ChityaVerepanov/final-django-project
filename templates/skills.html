{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="pages-title-centered-container">
    <div class="pages-title-container">
        <div class="icon-plus top-left">+</div>
        <div class="icon-plus top-right">+</div>
        <div class="icon-plus bottom-left">+</div>
        <div class="icon-plus bottom-right">+</div>
        <h1 class="demand-main-title">Навыки</h1>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<h2 class="pages-main-subtitle">ТОП-20 навыков для web-разработчика</h2>
<canvas id="skillsChart" width="400" height="200"></canvas>
<script>
    // Данные для графика ТОП-20 навыков
    const topSkills = {{top_skills | safe}}; // Получаем данные из контекста
    const skills = topSkills.map(skill => skill[0]); // Извлекаем названия навыков
    const skillCounts = topSkills.map(skill => skill[1]); // Извлекаем количество упоминаний навыков

    // Проверка данных в консоли
    console.log(skills);
    console.log(skillCounts);

    // Создание графика ТОП-20 навыков
    const ctxSkills = document.getElementById('skillsChart').getContext('2d');
    const skillsChart = new Chart(ctxSkills, {
        type: 'bar', // Тип графика: столбчатая диаграмма
        data: {
            labels: skills,
            datasets: [{
                label: 'Частота навыков',
                data: skillCounts,
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'ТОП-20 навыков'
                }
            }
        }
    });
</script>
{% endblock %}
